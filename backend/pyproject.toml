[project]
name = "meridien-backend"
version = "1.0.0"
description = "Meridien FastAPI GIS, Ingestion & Web3 MRV Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.19",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "web3>=7.6.0",
    "pillow>=11.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
